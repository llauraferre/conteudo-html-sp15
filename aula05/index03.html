<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula05 - HTML</title>
    </head>
    <body>
        <h1>Formatações de texto em HTML</h1>
        <p><b>Esse texto esta em destaque</b></p>
        <p><strong>Esse texto esta em strong</strong></p>
        <p><i>Esse texto esta em italico</i></p>
        <p><em>Esse texto esta enfatizado</em></p>
        <p><small>Esse texto esta em small</small></p>
        <p>Essa <mark>palavra</mark> esta marcada</p>
        <P>Esse texto esta com o <del>del</del></P>
        <p>Esse texto esta com o <ins>ins</ins></p>
        <P>Esse texto esta com o <sub>sub</sub></P>
        <p>Esse texto esta em <sup>sup</sup></p>

    </body>
</html>
