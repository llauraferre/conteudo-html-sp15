<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteudo aula 03 - HTML</title>
    </head>
    <body>
        <h1>Atributos em elementos no HTML</h1>
    <p>Exemplo de atributo href:</p>
    <a href="https://www.w3schools.com">Clique aqui</a>
    <hr>
    <p>Exemplo de atributo src: </p>
    <img src="passarinhos.jpg" width="250" height="145" alt="Passarinhos na arvore">
    <hr>
    <P>Exemplo de atributo style</P>
    <p>Esse texto é laranja</p>
    <p style="color:orangered;">Esse texto é laranja</p>
    </body>
</html>
