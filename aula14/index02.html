<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteudo Aula 14 - HTML</title>
    </head>
    <body>
        <h1>JavaScript no HTML</h1>
        <button onclick="document.getElementById('ex1').innerHTML = Date();">Adicionar hora e data</button>
        <p id="ex1"></p>
        <hr>
        <h3>Inserindo conteúdo em elementos com JavaScript</h3>
        <p id="ex2"></p>
        <hr>
        <h3>Alterando estilo de elementos com o JavaScript</h3>
        <p id="ex3">Somente a dor coletiva gera união</p>
        <button onclick="adicionarEstilo()">Alterar estilo</button>
        <script>
            // Inserindo conteudo com JavaScript
            document.getElementById("ex2").innerHTML = "Olá SP15!";
            // Alterando estilo de elemento com JavaScript
            function adicionarEstilo() {
                document.getElementById("ex3").style.color = "darkred";
                document.getElementById("ex3").style.backgroundColor = "black";
                document.getElementById("ex3").style.border = "4px solid";
                document.getElementById("ex3").style.padding = "10px";
                document.getElementsById("ex3").style.fontFamily = "sans-serif";
            }
        </script>
 
    </body>
</html>
