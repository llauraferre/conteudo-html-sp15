<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 14 - HTML</title>
        <style>
            .btn1 {
                border: none;
                width: 100%;
                height: 45px;
                background-color: aquamarine;
                color: aqua;
                font-family: monospace;
                font-weight: bold;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>Botões no HTML</h1>
        <h3>Utilizando botões no HTML</h3>
        <button class="btn1">Botão</button>
        <hr>
        <h3>Botão desativado</h3>
        <button disabled>Botão desativado</button>
        <hr>
        <h3>Botão com JavaScript</h3>
        <button onclick="alert('Turma SP15')">Clique aqui</button>
    </body>
</html>
