<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Aula 12 - HTML</title>
        <style>
            .cidades {
            background-color: crimson;
            border: 8px solid black;
            margin-bottom: 20px;
            padding-left: 20px;
            color: ghostwhite;
            font-family: sans-serif;
        }

        </style>
       
    </head>
    <body>

        <h1>Atributo class no HTML</h1>

        <div class="cidades"> 
            <h2>São Paulo</h2>
            <p>Capital de São Paulo</p>
        </div>

        <div class="cidades">
            <h2>Rio de Janeiro</h2>
            <p>Capital do Rio de Janeiro</p>
        </div>

        <div class="cidades">
            <h2>Bahia</h2>
            <p>Capital da Bahia</p>
        </div>
        
    </body>
</html>
